name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build Android App
        run: |
          mkdir /tmp/app_build
          cd /tmp/app_build
          flutter create --org com.sabt.app --project-name sabt_app .
          cp "$GITHUB_WORKSPACE/lib/main.dart" lib/main.dart
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sabt-App
          path: /tmp/app_build/build/app/outputs/flutter-apk/app-release.apk
